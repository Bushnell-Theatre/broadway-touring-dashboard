<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Access Restricted — Broadway Touring Intelligence</title>
    <style>
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #fdf8f4;
        color: #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .box {
        text-align: center;
        max-width: 420px;
        padding: 48px 32px;
        background: #fff;
        border: 1px solid #d8d4ce;
        border-top: 4px solid #003865;
        border-radius: 3px;
      }
      .icon {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 10px;
        color: #003865;
      }
      p {
        font-size: 0.82rem;
        color: #595959;
        line-height: 1.65;
        margin-bottom: 20px;
      }
      a {
        display: inline-block;
        background: #003865;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 10px 24px;
        border-radius: 2px;
        text-decoration: none;
      }
      a:hover {
        background: #00274d;
      }
      .sub {
        font-size: 0.68rem;
        color: #888;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">🔒</div>
      <h1>Access Restricted</h1>
      <p>
        This tool is available to Bushnell staff only. Please sign in with your
        <strong>@bushnell.org</strong>
        Microsoft account.
      </p>
      <a href="/.auth/login/aad?post_login_redirect_uri=/">Sign in with Bushnell Account</a>
      <p class="sub">If you believe you should have access, contact IT or the dashboard administrator.</p>
    </div>
  </body>
</html>
